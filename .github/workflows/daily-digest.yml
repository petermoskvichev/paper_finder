name: Daily arXiv digest

on:
  workflow_dispatch:
  schedule:
    # 00:15 UTC is 08:15 in Singapore. arXiv has new announcement batches on
    # Singapore Mondays-Fridays, so weekend requests would only repeat old data.
    - cron: "15 0 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-arxiv-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Headerless arXiv 429 responses are retried at five-minute intervals. Leave
    # enough room for that 15-minute retry window plus setup and ranking.
    timeout-minutes: 40
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore semantic model cache
        uses: actions/cache@v6
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-huggingface-all-MiniLM-L6-v2-v1

      - name: Install CPU inference runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch papers and send digest
        shell: bash
        run: |
          reference_args=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            reference_args=(--reference-time "$(date -u +%Y-%m-%dT00:15:00+00:00)")
          fi
          python -m arxiv_digest --config profile.yaml --send-email "${reference_args[@]}"
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
